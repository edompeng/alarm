name: CI & Android Release

on:
  push:
    branches: [ master, main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  LC_ALL: C.UTF-8
  LANG: C.UTF-8
  JAVA_TOOL_OPTIONS: -Dfile.encoding=UTF-8

jobs:
  init-version:
    name: Initialize Release Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.gen-ver.outputs.version }}
      version_tag: ${{ steps.gen-ver.outputs.version_tag }}
      version_code: ${{ steps.gen-ver.outputs.version_code }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate Version
        id: gen-ver
        run: |
          set -euo pipefail
          bash scripts/generate_version.sh
          VERSION="$(grep -m1 '^version=' "${GITHUB_OUTPUT}" | cut -d= -f2-)"
          VERSION_TAG="$(grep -m1 '^version_tag=' "${GITHUB_OUTPUT}" | cut -d= -f2-)"
          VERSION_CODE="$(grep -m1 '^version_code=' "${GITHUB_OUTPUT}" | cut -d= -f2-)"
          echo "Release version:     ${VERSION}"
          echo "Release tag:         ${VERSION_TAG}"
          echo "Release code:        ${VERSION_CODE}"

  build-android-and-linux:
    name: Android (Build, Test & Package)
    needs: [init-version]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        run: |
          ANDROID_ROOT="/usr/local/lib/android/sdk"
          echo "ANDROID_HOME=${ANDROID_ROOT}" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=${ANDROID_ROOT}" >> $GITHUB_ENV
          SDKMANAGER=$(find "${ANDROID_ROOT}/cmdline-tools" -type f -name sdkmanager 2>/dev/null | head -n 1)
          if [ -n "${SDKMANAGER}" ] && [ -x "${SDKMANAGER}" ]; then
            echo "Using sdkmanager: ${SDKMANAGER}"
            yes | "${SDKMANAGER}" --licenses > /dev/null 2>&1 || true
            "${SDKMANAGER}" "platforms;android-34" "build-tools;34.0.0"
          fi

      - name: Set up Bazelisk
        uses: bazelbuild/setup-bazelisk@v3

      - name: Run Python Holiday Config Tests
        run: |
          python3 -m unittest discover -s tests -p "test_*.py"

      - name: Verify Holiday Config Generation Consistency
        run: |
          python3 scripts/generate_holiday_config.py --year 2026 -o core/src/assets/holidays_2026.json
          git diff --exit-code core/src/assets/holidays_2026.json

      - name: Run Java Policy Unit Tests
        run: |
          bash scripts/test_java.sh

      - name: Run Bazel C++ Unit Tests
        run: |
          bazel test --keep_going //...

      - name: Restore Release Signing Material
        id: signing
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.ALARM_RELEASE_KEYSTORE_BASE64 }}
          SIGNING_KEY_ALIAS: ${{ secrets.ALARM_RELEASE_KEY_ALIAS }}
          SIGNING_KEYSTORE_PASSWORD: ${{ secrets.ALARM_RELEASE_KEYSTORE_PASSWORD }}
          SIGNING_KEY_PASSWORD: ${{ secrets.ALARM_RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${SIGNING_KEYSTORE_BASE64}" ]; then
            if [ "${{ github.event_name }}" = "pull_request" ]; then
              echo "::warning::Release signing secrets are not configured; this pull-request build is signed with a throwaway key and must never be published."
              echo "keystore_path=" >> "${GITHUB_OUTPUT}"
              exit 0
            fi
            echo "::error::Release signing secrets are missing. Configure ALARM_RELEASE_KEYSTORE_BASE64, ALARM_RELEASE_KEY_ALIAS, ALARM_RELEASE_KEYSTORE_PASSWORD and ALARM_RELEASE_KEY_PASSWORD so release APKs keep a stable signature."
            exit 1
          fi
          for name in SIGNING_KEY_ALIAS SIGNING_KEYSTORE_PASSWORD SIGNING_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Release signing secret ${name} is missing."
              exit 1
            fi
          done
          KEYSTORE_PATH="${RUNNER_TEMP}/alarm-release.keystore"
          printf '%s' "${SIGNING_KEYSTORE_BASE64}" | base64 -d > "${KEYSTORE_PATH}"
          chmod 600 "${KEYSTORE_PATH}"
          keytool -list -keystore "${KEYSTORE_PATH}" \
            -storepass "${SIGNING_KEYSTORE_PASSWORD}" \
            -alias "${SIGNING_KEY_ALIAS}" > /dev/null
          echo "keystore_path=${KEYSTORE_PATH}" >> "${GITHUB_OUTPUT}"
          echo "Release signing material restored and verified (alias: ${SIGNING_KEY_ALIAS})."

      - name: Package Android Release
        env:
          ALARM_RELEASE_KEYSTORE: ${{ steps.signing.outputs.keystore_path }}
          ALARM_RELEASE_KEY_ALIAS: ${{ secrets.ALARM_RELEASE_KEY_ALIAS }}
          ALARM_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.ALARM_RELEASE_KEYSTORE_PASSWORD }}
          ALARM_RELEASE_KEY_PASSWORD: ${{ secrets.ALARM_RELEASE_KEY_PASSWORD }}
        run: |
          bash scripts/package_releases.sh --skip-checksums \
            --version-name "${{ needs.init-version.outputs.version }}" \
            --version-code "${{ needs.init-version.outputs.version_code }}"

      - name: Verify Android APK Signatures
        run: |
          PRIMARY_DIGEST=""
          for apk in dist/*.apk; do
            echo "--> Verifying signature of ${apk}..."
            "${ANDROID_HOME}/build-tools/34.0.0/apksigner" verify --verbose "${apk}"
            DIGEST="$("${ANDROID_HOME}/build-tools/34.0.0/apksigner" verify --print-certs "${apk}" \
              | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -n 1)"
            if [ -z "${DIGEST}" ]; then
              echo "::error::No signer certificate found for ${apk}"
              exit 1
            fi
            if [ -z "${PRIMARY_DIGEST}" ]; then
              PRIMARY_DIGEST="${DIGEST}"
            elif [ "${DIGEST}" != "${PRIMARY_DIGEST}" ]; then
              echo "::error::${apk} is signed by a different key (${DIGEST} != ${PRIMARY_DIGEST})."
              exit 1
            fi
          done
          echo "All Android artifacts share one signer: ${PRIMARY_DIGEST}"

      - name: Upload Android Release Assets
        uses: actions/upload-artifact@v4
        with:
          name: release-assets-android
          path: dist/*.apk
          if-no-files-found: error

  publish-release:
    name: Publish Android Release
    needs: [init-version, build-android-and-linux]
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download All Release Assets
        uses: actions/download-artifact@v4
        with:
          pattern: release-assets-*
          path: release-dist
          merge-multiple: true

      - name: Consolidate SHA256 Checksums & Prepare Release Notes
        run: |
          cd release-dist
          rm -f *.idsig SHA256SUMS.txt
          sha256sum SmartAlarm-v*.apk > SHA256SUMS.txt
          echo "=== Consolidated Release Assets ==="
          ls -lh
          echo "=== SHA256SUMS.txt ==="
          cat SHA256SUMS.txt

          RELEASE_TAG="${{ needs.init-version.outputs.version_tag }}"
          echo "RELEASE_TAG=${RELEASE_TAG}" >> $GITHUB_ENV

          cat << EOF > ../release_notes.md
          ## 🚀 Smart Alarm (智能法定节假日闹钟) Android 发行版 (${RELEASE_TAG})

          Smart Alarm 是一款专为中国法定节假日与复杂唤醒场景设计的高可靠性智能闹钟应用，采用 C++20 跨平台核心业务层 + JNI 桥接 + 原生 Android UI 架构。

          ### 📱 Android 发行包 (Signed APKs)
          - \`SmartAlarm-${RELEASE_TAG}-android-universal.apk\` — **通用安装包** (内置全套资源，推荐多数 Android 11+ 设备直接安装)
          - \`SmartAlarm-${RELEASE_TAG}-android-arm64-v8a.apk\` — **ARM64-v8a 优化包** (面向主流 64 位 ARM 智能手机，性能最优)
          - \`SmartAlarm-${RELEASE_TAG}-android-armeabi-v7a.apk\` — **ARMv7 兼容包** (兼容旧款 32 位 ARM 设备)
          - \`SmartAlarm-${RELEASE_TAG}-android-x86_64.apk\` — **x86_64 架构包** (适配 Android 模拟器与 x86 架构移动设备)

          ### 🔒 完整性与校验和 (SHA256 Checksums)
          \`\`\`
          EOF
          cat SHA256SUMS.txt >> ../release_notes.md
          echo '\`\`\`' >> ../release_notes.md

      - name: Publish Release to GitHub Releases
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: Smart Alarm ${{ env.RELEASE_TAG }} Release
          body_path: release_notes.md
          target_commitish: ${{ github.sha }}
          draft: false
          prerelease: false
          make_latest: true
          files: |
            release-dist/SmartAlarm-v*.apk
            release-dist/SHA256SUMS.txt
