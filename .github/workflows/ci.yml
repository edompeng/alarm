name: CI & Release Build

on:
  push:
    branches: [ master, main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-and-test:
    name: Build, Test & Package Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK Components
        run: |
          echo "ANDROID_HOME=${ANDROID_SDK_ROOT}" >> $GITHUB_ENV
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Set up Bazelisk
        uses: bazel-contrib/setup-bazelisk@v0.8.5

      - name: Run Python Holiday Config Tests
        run: |
          python3 -m unittest discover -s tests -p "test_*.py"

      - name: Verify Holiday Config Generation Consistency
        run: |
          python3 scripts/generate_holiday_config.py --year 2026 -o core/src/assets/holidays_2026.json
          git diff --exit-code core/src/assets/holidays_2026.json

      - name: Run Java Policy Unit Tests
        run: |
          bash scripts/test_java.sh

      - name: Run Bazel C++ Unit Tests
        run: |
          bazel test --keep_going //...

      - name: Build Runnable Release APK
        run: |
          bazel build --keep_going //app:alarm_release_apk
          ls -lh bazel-bin/app/alarm_release_apk.apk

      - name: Verify Release APK Signature and Alignment
        run: |
          $ANDROID_SDK_ROOT/build-tools/34.0.0/apksigner verify --verbose bazel-bin/app/alarm_release_apk.apk

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: alarm-release-apk
          path: bazel-bin/app/alarm_release_apk.apk
          if-no-files-found: error

      - name: Publish GitHub Release (Tagged Push)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: bazel-bin/app/alarm_release_apk.apk
          generate_release_notes: true
